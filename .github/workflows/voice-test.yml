name: VAS 批量语音测试
run-name: VAS ${{ inputs.environment }} · 批量场景 · ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: VAS 环境
        type: choice
        options:
          - dev
          - main
        default: dev
        required: true
      device_id:
        description: 测试设备 MAC；留空使用仓库变量 VAS_DEVICE_ID
        type: string
        required: false
      scenario_path:
        description: scenarios/ 内的文件或文件夹；每个文件是独立会话
        type: string
        default: scenarios/smoke
        required: false
      diagnostics:
        description: frame 记录环节与逐帧事件；stage 只记录环节计时
        type: choice
        options:
          - frame
          - stage
        default: frame
        required: true

permissions:
  contents: read

concurrency:
  group: voice-test-${{ inputs.environment }}-${{ inputs.device_id || vars.VAS_DEVICE_ID || 'missing-device' }}
  cancel-in-progress: false

jobs:
  test:
    name: 对话测试与报告
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 获取测试工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 准备缓存的 Docker 测试环境
        id: image
        uses: ./.github/actions/test-image

      - name: 执行会话测试
        env:
          SCENARIO_PATH: ${{ inputs.scenario_path }}
          VAS_ENVIRONMENT: ${{ inputs.environment }}
          VAS_DEVICE_ID: ${{ inputs.device_id || vars.VAS_DEVICE_ID }}
          VAS_DIAGNOSTICS: ${{ inputs.diagnostics }}
          VAS_TOKEN: ${{ secrets.VAS_TOKEN }}
          VAS_DEV_URL: ${{ vars.VAS_DEV_URL }}
          VAS_MAIN_URL: ${{ vars.VAS_MAIN_URL }}
        run: |
          bash .github/actions/test-image/run.sh python -m voice_scenarios.batch_run --scenarios "${SCENARIO_PATH:-scenarios/smoke}" --output artifacts/run

      - name: 保存完整报告与音频
        id: report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vas-batch-${{ inputs.environment }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/run/
          if-no-files-found: warn
          retention-days: 14

      - name: 在运行结果中展示报告摘要
        if: always()
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          if docker image inspect aquamind-vas-testing:local >/dev/null 2>&1; then
            bash .github/actions/test-image/run.sh python -m voice_scenarios.batch_run --summarize artifacts/run
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          url = os.environ.get("REPORT_ARTIFACT_URL", "")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              if url:
                  summary.write(f"\n[下载完整报告与音频]({url})\n\n解压后打开 `index.html`，选择 session 查看完整会话播放与时间轴。\n")
              else:
                  summary.write("\n本次未生成可下载的报告，请查看失败步骤的日志。\n")
          PY
