name: VAS 批量语音测试
run-name: VAS · 批量场景 · ${{ github.run_number }}

on:
  schedule:
    # GitHub cron uses UTC: 23:00 UTC is 07:00 the following day in Shanghai.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      scenario_path:
        description: scenarios/ 内的文件或文件夹；每个文件是独立会话
        type: string
        default: scenarios/smoke
        required: false

permissions:
  contents: read

# Saved sessions can target different devices; serialize scheduled and manual tests.
concurrency:
  group: voice-tests
  cancel-in-progress: false

jobs:
  test:
    name: 全量校验与逐会话测试
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 获取测试工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 准备一次缓存的 Docker 测试环境
        id: image
        uses: ./.github/actions/test-image

      - name: 校验全部场景并逐会话运行
        id: batch
        continue-on-error: true
        env:
          SCENARIO_PATH: ${{ inputs.scenario_path }}
          VAS_DIAGNOSTICS: frame
          VAS_TOKEN: ${{ secrets.VAS_TOKEN }}
          VAS_DEV_URL: ${{ vars.VAS_DEV_URL }}
          VAS_MAIN_URL: ${{ vars.VAS_MAIN_URL }}
        run: bash .github/actions/test-image/run.sh python -m voice_scenarios.batch_run --scenarios "${SCENARIO_PATH:-scenarios/smoke}" --output artifacts/run

      - name: 逐会话压缩音频并保留失败原件
        id: package
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/actions/test-image/run.sh python -m voice_scenarios.report_archive artifacts/run --batch --output artifacts/download

      - name: 保存批量报告与音频
        id: report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vas-batch-${{ github.run_number }}-${{ github.run_attempt }}
          # Catastrophic packaging errors retain the entire original run.
          path: ${{ hashFiles('artifacts/download/archive-complete.json') != '' && 'artifacts/download/' || 'artifacts/' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: 展示批量结果
        id: summary
        if: always()
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          if docker image inspect aquamind-vas-testing:local >/dev/null 2>&1; then
            if test -f artifacts/download/batch.json; then
              bash .github/actions/test-image/run.sh python -m voice_scenarios.batch_run --summarize artifacts/download
            else
              bash .github/actions/test-image/run.sh python -m voice_scenarios.batch_run --summarize artifacts/run
            fi
          fi
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          url = os.environ.get("REPORT_ARTIFACT_URL", "")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              if url:
                  summary.write(f"\n[下载批量 HTML、Excel 与音频]({url})\n\n解压后打开 `index.html`，每个 session 独立查看。压缩失败的会话保留在 `raw-fallback/`；整体打包异常时另保留 `run/`。\n")
              else:
                  summary.write("\n报告上传失败，请查看执行日志。\n")
          PYTHON

      - name: 检查批量最终结果
        if: always()
        env:
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          BATCH_OUTCOME: ${{ steps.batch.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: >-
          python3 scripts/check_batch_result.py artifacts/run artifacts/download
          --outcome "$IMAGE_OUTCOME" --outcome "$BATCH_OUTCOME"
          --outcome "$PACKAGE_OUTCOME" --outcome "$REPORT_OUTCOME" --outcome "$SUMMARY_OUTCOME"
