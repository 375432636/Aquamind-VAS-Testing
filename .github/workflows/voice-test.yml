name: VAS 语音测试
run-name: VAS ${{ inputs.environment }} · ${{ inputs.source }} · ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: VAS 环境
        type: choice
        options:
          - dev
          - main
        default: dev
        required: true
      device_id:
        description: 测试设备 MAC；留空使用仓库变量 VAS_DEVICE_ID
        type: string
        required: false
      source:
        description: 已保存的场景文件（默认）或临时输入 JSON
        type: choice
        options:
          - saved_files
          - inline_json
        default: saved_files
        required: true
      scenario_path:
        description: saved_files：scenarios/ 内的文件或文件夹；每个文件是独立 session
        type: string
        default: scenarios/smoke
        required: false
      turns_json:
        description: 仅 inline_json 使用；同一 session 的临时对话数组
        type: string
        required: false
      input_mode:
        description: 仅 inline_json 使用；已保存场景使用各文件的 input_mode
        type: choice
        options:
          - manual
          - vad
        default: manual
        required: true
      diagnostics:
        description: stage 环节计时；frame 增加逐帧事件
        type: choice
        options:
          - stage
          - frame
        default: stage
        required: true
      turn_timeout_seconds:
        description: 仅 inline_json 使用；已保存场景使用各文件的超时配置
        type: number
        default: 90
        required: true

permissions:
  contents: read

concurrency:
  group: voice-test-${{ inputs.environment }}-${{ inputs.device_id || vars.VAS_DEVICE_ID || 'missing-device' }}
  cancel-in-progress: false

jobs:
  test:
    name: 对话测试与报告
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 获取测试工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装语音与测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y espeak-ng ffmpeg libopus0
          python -m pip install -e '.[test]'

      - name: 执行会话测试
        env:
          TEST_SOURCE: ${{ inputs.source }}
          SCENARIO_PATH: ${{ inputs.scenario_path }}
          VAS_ENVIRONMENT: ${{ inputs.environment }}
          VAS_DEVICE_ID: ${{ inputs.device_id || vars.VAS_DEVICE_ID }}
          VAS_TURNS_JSON: ${{ inputs.turns_json }}
          VAS_INPUT_MODE: ${{ inputs.input_mode }}
          VAS_DIAGNOSTICS: ${{ inputs.diagnostics }}
          VAS_TURN_TIMEOUT_SECONDS: ${{ inputs.turn_timeout_seconds }}
          VAS_TOKEN: ${{ secrets.VAS_TOKEN }}
          VAS_DEV_URL: ${{ vars.VAS_DEV_URL }}
          VAS_MAIN_URL: ${{ vars.VAS_MAIN_URL }}
        run: |
          if [ "$TEST_SOURCE" = "saved_files" ]; then
            unset VAS_INPUT_MODE VAS_TURN_TIMEOUT_SECONDS
            python -m voice_scenarios.batch_run --scenarios "${SCENARIO_PATH:-scenarios/smoke}" --output artifacts/run
          else
            python -m voice_scenarios.ci_run --output artifacts/run
          fi

      - name: 保存完整报告与音频
        id: report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vas-${{ inputs.environment }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/run/
          if-no-files-found: warn
          retention-days: 14

      - name: 在运行结果中展示报告摘要
        if: always()
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          if [ -f artifacts/run/batch.json ]; then
            python -m voice_scenarios.batch_run --summarize artifacts/run
          else
            python -m voice_scenarios.ci_run --summarize artifacts/run
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          url = os.environ.get("REPORT_ARTIFACT_URL", "")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              if url:
                  summary.write(f"\n[下载完整报告与音频]({url})\n\n解压后打开 `index.html`，选择 session 查看完整会话播放与时间轴。\n")
              else:
                  summary.write("\n本次未生成可下载的报告，请查看失败步骤的日志。\n")
          PY
