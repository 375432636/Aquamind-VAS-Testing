name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 测试与格式检查
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 准备缓存的 Docker 测试环境
        id: image
        uses: ./.github/actions/test-image
      - name: 检查格式
        run: |
          bash .github/actions/test-image/run.sh python -m black --check main.py voice_scenarios tests scripts
          bash .github/actions/test-image/run.sh python -m isort --check-only main.py voice_scenarios tests scripts
      - name: 测试时间轴交互
        run: node --test tests/*.test.cjs
      - name: 运行测试
        env:
          CI_REPORT_DIR: artifacts/ci-example
          CI_BATCH_REPORT_DIR: artifacts/batch-example
          CI_PERSONA_REPORT_DIR: artifacts/persona-example
          CI_TIMELINE_REPORT_DIR: artifacts/timeline-clock-example
        run: bash .github/actions/test-image/run.sh python -m pytest --cov-config=.coveragerc-client --cov=voice_scenarios --cov-fail-under=80 --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/junit.xml
      - name: 保存测试结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-results
          path: |
            artifacts/coverage.xml
            artifacts/junit.xml
            artifacts/ci-example/
            artifacts/batch-example/
            artifacts/persona-example/
            artifacts/timeline-clock-example/
          if-no-files-found: warn
          retention-days: 14
