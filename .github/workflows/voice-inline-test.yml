name: VAS 临时对话测试
run-name: VAS ${{ inputs.environment }} · 临时对话 · ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: VAS 环境
        type: choice
        options:
          - dev
          - main
        default: dev
        required: true
      device_id:
        description: 测试设备 MAC；留空使用仓库变量 VAS_DEVICE_ID
        type: string
        required: false
      turns_json:
        description: 按顺序填写问题，如 ["推荐两款耳机","详细介绍第一款"]；在同一会话中执行
        type: string
        required: true
      input_mode:
        description: manual 发完后主动结束；vad 持续发送底噪，由服务端判断结束
        type: choice
        options:
          - manual
          - vad
        default: manual
        required: true
      diagnostics:
        description: frame 记录环节与逐帧事件；stage 只记录环节计时
        type: choice
        options:
          - frame
          - stage
        default: frame
        required: true
      turn_timeout_seconds:
        description: 每轮从开始发送到回复完成的最长时间，单位秒
        type: number
        default: 90
        required: true

permissions:
  contents: read

# Both workflows share the same device lock, preventing overlapping conversations.
concurrency:
  group: voice-test-${{ inputs.environment }}-${{ inputs.device_id || vars.VAS_DEVICE_ID || 'missing-device' }}
  cancel-in-progress: false

jobs:
  test:
    name: 对话测试与报告
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 获取测试工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装语音与测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y espeak-ng ffmpeg libopus0
          python -m pip install -e '.[test]'

      - name: 执行会话测试
        env:
          VAS_ENVIRONMENT: ${{ inputs.environment }}
          VAS_DEVICE_ID: ${{ inputs.device_id || vars.VAS_DEVICE_ID }}
          VAS_TURNS_JSON: ${{ inputs.turns_json }}
          VAS_INPUT_MODE: ${{ inputs.input_mode }}
          VAS_DIAGNOSTICS: ${{ inputs.diagnostics }}
          VAS_TURN_TIMEOUT_SECONDS: ${{ inputs.turn_timeout_seconds }}
          VAS_TOKEN: ${{ secrets.VAS_TOKEN }}
          VAS_DEV_URL: ${{ vars.VAS_DEV_URL }}
          VAS_MAIN_URL: ${{ vars.VAS_MAIN_URL }}
        run: python -m voice_scenarios.ci_run --output artifacts/run

      - name: 保存完整报告与音频
        id: report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vas-inline-${{ inputs.environment }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/run/
          if-no-files-found: warn
          retention-days: 14

      - name: 在运行结果中展示报告摘要
        if: always()
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          python -m voice_scenarios.ci_run --summarize artifacts/run
          python - <<'PY'
          import os
          from pathlib import Path

          url = os.environ.get("REPORT_ARTIFACT_URL", "")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              if url:
                  summary.write(f"\n[下载完整报告与音频]({url})\n\n解压后打开 `report.html`，查看完整会话播放与时间轴。\n")
              else:
                  summary.write("\n本次未生成可下载的报告，请查看失败步骤的日志。\n")
          PY
