name: Cached voice test image
description: Build the common Linux voice test environment using GitHub layer cache
runs:
  using: composite
  steps:
    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: 构建并复用测试环境
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: .
        load: true
        push: false
        platforms: linux/amd64
        tags: aquamind-vas-testing:local
        cache-from: type=gha,scope=voice-tests-linux-amd64,version=2
        # A cache service outage must not prevent the actual tests from running.
        cache-to: type=gha,scope=voice-tests-linux-amd64,version=2,mode=max,ignore-error=true,timeout=3m
