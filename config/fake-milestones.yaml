# 与 vad.example.yaml / milestones.example.yaml 配套，全部依赖由 Fake 提供。
vad_silence_seconds: 0.6
embedding_delay_ms: 450
tts_headers_delay_ms: 40
tts_first_delay_ms: 100
tts_empty_chunks: 1
tts_duration_seconds: 1.2
tts_chunk_delay_ms: 60
guardrail:
  semantic_constraints:
    - name: Fake 拦截规则
      sentences: [FAKE-BLOCKED]
      strictness: 5
      response: 测试护栏已拦截。
      is_enabled: true
turns:
  - text: 你好，请介绍一下自己。
    reply: 我是本地语音测试助手。
    llm_metadata_first: true
    llm_first_delay_ms: 120
  - text: 那再帮我查一下上海天气。
    reply: 上海晴天二十六度。
    tool_rounds:
      - name: self_test_weather
        arguments: {city: 上海}
        pre_speech: 我来查询上海天气。
