<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aquamind · 实时对话测试</title><link rel="stylesheet" href="/live/assets/live.css?v=6"></head>
<body><main><header><div><small>AQUAMIND · LIVE TESTING</small><h1>实时对话</h1><p>使用麦克风或文字对话；关闭记录开关可直接试聊，不保存报告和会话音频。</p></div><span id="status" role="status">未连接</span></header>
<section class="connection"><label>环境<select id="environment"><option value="dev">Aquamind DEV</option><option value="main">Aquamind MAIN</option><option value="5090">5090 · 常规 VAS</option><option value="local">本地 · HTTP/WS</option></select></label><label id="5090-address-field" hidden>5090 地址<select id="5090-address"><option value="5090-tailscale">Tailscale · 100.114.113.70</option><option value="5090-lan">内网 · 10.10.95.179</option></select></label><label>设备 MAC<input id="mac" required placeholder="00:00:00:00:00:21" autocomplete="off"></label><label class="recording-toggle"><input id="recording" type="checkbox" role="switch" checked>记录日志并生成报告</label><button id="connect">连接并开始记录</button><button id="finish" disabled>结束并生成报告</button><details><summary>连接选项</summary><label><input id="clock-sync" type="checkbox" checked>校准客户端与 VAS 时间</label><label>设备认证 Token<input id="token" type="password" autocomplete="off"></label><label><input id="ota" type="checkbox" checked>沿用 Console OTA 校验</label></details></section>
<div id="error" role="alert" hidden></div><div id="downloads" hidden></div>
<section class="conversation"><div id="messages" role="log" aria-live="polite"><p class="placeholder">连接后，在同一个会话中连续提问。</p></div><form id="text-form"><input id="text" placeholder="输入一句话…" aria-label="对话内容" disabled><button id="send" disabled>发送</button></form>
<div class="voice-tools"><label>语音模式<select id="mode"><option value="manual">手动结束 · 按住空格说话</option><option value="vad">自动结束 · VAD 连续对话</option></select></label><button id="talk" disabled>按住说话 · 松开结束</button><button id="interrupt" disabled>打断回复</button><span id="mic-status" role="status">麦克风未开启</span></div><div class="mic-tools"><label>麦克风<select id="mic-device"><option value="">系统默认麦克风</option></select></label><button id="mic-check" type="button">检测麦克风</button><label>输入电平<meter id="mic-level" min="0" max="100" value="0" aria-label="麦克风输入电平"></meter></label><audio id="mic-preview" controls hidden aria-label="麦克风检测回听"></audio></div><p id="input-control" class="input-control" role="status">手动结束 · 等待按下空格或说话按钮</p><p id="voice-hint" class="voice-hint">按住空格说话，松开发送；文字输入框内的空格用于输入。首次使用请先检测麦克风。</p></section>
<footer>浏览器直连 VAS · 录音与播放沿用 Console 逻辑 · 开启记录后本地保存 HTML、Excel 和会话音频</footer></main><script type="module" src="/live/assets/app.mjs?v=14"></script></body></html>
