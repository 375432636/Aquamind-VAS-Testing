[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-scenario-tests"
version = "0.1.0"
description = "Reusable audio conversation scenarios with timed interruptions"
requires-python = ">=3.10"
dependencies = ["websockets>=14,<16", "PyYAML>=6,<7", "opuslib-next>=1.1,<2", "aiohttp>=3.13,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "black>=25,<26", "isort>=6,<7"]

[project.scripts]
voice-scenarios = "voice_scenarios.__main__:main"

[tool.setuptools.packages.find]
include = ["voice_scenarios*", "aquamind_voice_report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.isort]
profile = "black"

[tool.setuptools.package-data]
voice_scenarios = ["*.html", "*.js", "*.css"]
aquamind_voice_report = ["*.html", "*.js", "*.css"]
