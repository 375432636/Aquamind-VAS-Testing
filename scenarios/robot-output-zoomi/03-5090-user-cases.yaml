name: Zoomi robot_output · 5090 · 平台展馆导览的三个用户场景
device_id: "C2:B8:56:7B:95:7C"
environment: main
features:
  scene_navigation: true
input_mode: text
turn_timeout_seconds: 90
turns:
  - id: navigation-a-zone
    text: 带我到 A 区。
    expect:
      business:
        robot_output: {called: true, navigation: true}
  - id: product-bone-conduction
    text: 推荐一款骨传导耳机给我。
    expect:
      business:
        robot_output: {called: true, product_refs: true}
  - id: greeting-wave
    text: 你好可以挥挥手吗？
    expect:
      business:
        robot_output: {called: true, action: true, expression: true}
