name: 新闻黄历、肢体互动与产品介绍
device_id: "30:ED:A0:A6:23:A4"
environment: dev
input_mode: vad
turns:
  - id: news
    text: 帮我看一下今天的新闻
    expect:
      business:
        reply:
          contains_all: [[星象, 星盘, 星座, 太阳处女, 月亮天秤, 水星逆行]]
  - id: almanac
    text: 帮我看一下今天的黄历。
    expect:
      business:
        recognition:
          contains_all: [[黄历, 通胜, 老黄历]]
  - id: head-touch
    sensor: touch-head
  - id: products
    text: 给我介绍一下产品，这有什么好玩的？
