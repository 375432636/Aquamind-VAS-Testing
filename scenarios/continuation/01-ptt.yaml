name: 续说窗口 · PTT
device_id: "30:ED:A0:A6:23:A4"
environment: dev
input_mode: manual
turn_timeout_seconds: 90
turns:
  - text: 请用一句话介绍自己
  - chunks:
      - text: 请给我介绍一下
      - text: 红茶和绿茶有什么区别
        resume_after_endpoint_ms: 150
